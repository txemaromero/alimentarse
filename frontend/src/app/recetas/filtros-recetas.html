<div ngbAccordion class="mb-4 filtros">
  <div ngbAccordionItem [collapsed]="empiezaPlegado()">
    <h2 ngbAccordionHeader class="m-0">
      <button ngbAccordionButton>
        <fa-icon [icon]="iconos.filtrar" class="me-2" />
        Filtros
        @if (activos() > 0) {
          <span class="badge rounded-pill text-bg-primary ms-2">
            {{ activos() }} {{ activos() === 1 ? 'activo' : 'activos' }}
          </span>
        }
      </button>
    </h2>
    <div ngbAccordionCollapse>
      <div ngbAccordionBody>
        <ng-template>
          <form [formGroup]="formulario" (ngSubmit)="aplicar()" novalidate>
            <div class="row g-3">
              <div class="col-md-6 col-lg-4">
                <label [for]="id('titulo')" class="form-label">Título</label>
                <input
                  [id]="id('titulo')"
                  type="search"
                  class="form-control"
                  formControlName="titulo"
                  maxlength="100"
                  placeholder="Contiene…"
                />
              </div>

              <div class="col-md-6 col-lg-4">
                <label [for]="id('tipo')" class="form-label">Tipo</label>
                <select [id]="id('tipo')" class="form-select" formControlName="tipo">
                  <option [ngValue]="null">Todos</option>
                  @for (tipo of tipos(); track tipo.id) {
                    <option [ngValue]="tipo.id">{{ tipo.nombre }}</option>
                  }
                </select>
              </div>

              @if (conAutor()) {
                <div class="col-md-6 col-lg-4">
                  <label [for]="id('usuario')" class="form-label">Autor</label>
                  <input
                    [id]="id('usuario')"
                    type="search"
                    class="form-control"
                    formControlName="usuario"
                    maxlength="30"
                    placeholder="Nombre de usuario…"
                    autocapitalize="none"
                  />
                </div>
              }

              <div class="col-md-6 col-lg-4">
                <label [for]="id('dificultad')" class="form-label">Dificultad</label>
                <select [id]="id('dificultad')" class="form-select" formControlName="dificultad">
                  <option [ngValue]="null">Cualquiera</option>
                  @for (dificultad of dificultades; track dificultad) {
                    <option [ngValue]="dificultad">{{ dificultad }}</option>
                  }
                </select>
              </div>

              <div class="col-md-6 col-lg-4">
                <label [for]="id('comensales')" class="form-label">Comensales (mínimo)</label>
                <input
                  [id]="id('comensales')"
                  type="number"
                  min="1"
                  max="100"
                  class="form-control"
                  formControlName="comensales"
                  [class.is-invalid]="esInvalido(formulario.controls.comensales)"
                  [attr.aria-describedby]="id('comensales-error')"
                />
                <app-error-campo
                  [control]="formulario.controls.comensales"
                  [idMensaje]="id('comensales-error')"
                />
              </div>

              <div class="col-md-6 col-lg-4">
                <label [for]="id('tiempo')" class="form-label">Tiempo máximo (minutos)</label>
                <input
                  [id]="id('tiempo')"
                  type="number"
                  min="1"
                  max="1440"
                  class="form-control"
                  formControlName="tiempoMax"
                  [class.is-invalid]="esInvalido(formulario.controls.tiempoMax)"
                  [attr.aria-describedby]="id('tiempo-error')"
                />
                <app-error-campo
                  [control]="formulario.controls.tiempoMax"
                  [idMensaje]="id('tiempo-error')"
                />
              </div>

              <div class="col-12">
                <label [for]="id('ingrediente')" class="form-label">
                  Ingredientes <span class="text-body-secondary">(debe tenerlos todos)</span>
                </label>
                <input
                  [id]="id('ingrediente')"
                  type="text"
                  class="form-control"
                  [formControl]="busqueda"
                  [ngbTypeahead]="buscarIngredientes"
                  [inputFormatter]="nombreIngrediente"
                  [resultTemplate]="resultadoIngrediente"
                  (selectItem)="elegirIngrediente($event)"
                  placeholder="Escribe y elige un ingrediente…"
                  [attr.aria-describedby]="id('ingredientes-elegidos')"
                />
                <ul
                  class="list-unstyled d-flex flex-wrap gap-2 mt-2 mb-0"
                  [id]="id('ingredientes-elegidos')"
                  aria-label="Ingredientes elegidos"
                >
                  @for (ingrediente of ingredientes(); track ingrediente.id) {
                    <li class="chip">
                      {{ ingrediente.nombre }}
                      <button
                        type="button"
                        class="btn-close"
                        [attr.aria-label]="'Quitar ' + ingrediente.nombre"
                        (click)="quitarIngrediente(ingrediente)"
                      ></button>
                    </li>
                  }
                </ul>
              </div>
            </div>

            <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-danger" (click)="restablecer()">
                <fa-icon [icon]="iconos.restablecer" class="me-1" />
                Restablecer
              </button>
              <button type="submit" class="btn btn-primary" [disabled]="formulario.invalid">
                <fa-icon [icon]="iconos.filtrar" class="me-1" />
                Filtrar
              </button>
            </div>
          </form>
        </ng-template>
      </div>
    </div>
  </div>
</div>

<ng-template #resultadoIngrediente let-ingrediente="result" let-termino="term">
  <ngb-highlight [result]="ingrediente.nombre" [term]="termino" />
  <small class="text-body-secondary ms-1">· {{ ingrediente.grupo.nombre }}</small>
</ng-template>
