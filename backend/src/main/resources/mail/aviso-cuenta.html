<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo}">Ha cambiado el email de tu cuenta de Alimentarse</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f2f2; font-family:Arial, Helvetica, sans-serif; color:#333333;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f2f2; padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background-color:#bfa48a; padding:20px 28px; color:#ffffff; font-size:22px; font-weight:bold;">
              Toca · ¿Qué toca hoy?
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <h1 style="margin:0 0 16px; font-size:20px; color:#333333;">Hola, <span th:text="${nombre}">Lucía</span></h1>
              <p style="margin:0 0 20px; line-height:1.5;" th:text="${mensaje}">El email de tu cuenta de Toca ha cambiado.</p>
              <p style="margin:0 0 20px; line-height:1.5;">
                <a th:href="${urlLogin}" href="#" style="display:inline-block; background-color:#3a7d44; color:#ffffff; text-decoration:none; padding:12px 22px; border-radius:6px; font-weight:bold;">Ir a Toca</a>
              </p>
              <p style="margin:0; font-size:13px; color:#777777;">Si no has sido tú, cambia tu contraseña y escribe a la administración de la aplicación lo antes posible.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px; background-color:#faf7f4; font-size:12px; color:#999999;">
              Alimentarse · Este es un mensaje automático, no respondas a este correo.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
